server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: photfolio-backend
  mail:
    host: smtp.gmail.com
    port: 587
    username: goswamiyash289@gmail.com
    password: ${MAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
