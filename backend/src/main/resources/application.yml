server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: photfolio-backend
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME:${MAIL_USERNAME:}}
    password: ${MAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 15000
          timeout: 15000
          writetimeout: 15000
          connectionpool: true
          connectionpoolsize: 5
          quitwait: false
          starttls:
            enable: true
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI}
      auto-index-creation: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

app:
  baseUrl: ${APP_BASE_URL:}
  frontendBaseUrl: ${APP_FRONTEND_BASE_URL:http://localhost:5173}
  admin:
    email: ${APP_ADMIN_EMAIL:}
    password: ${APP_ADMIN_PASSWORD:}
  jwt:
    secret: ${JWT_SECRET}
    ttlMinutes: 120
  storage:
    uploadDir: ${APP_STORAGE_UPLOAD_DIR:${user.home}/photfolio-uploads}
  cors:
    allowedOrigins:
      - "http://localhost:5173"
      - "http://127.0.0.1:5173"
      - "https://visualnest.vercel.app"
      - "https://www.visualnest.vercel.app"
      - "https://*.vercel.app"

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
