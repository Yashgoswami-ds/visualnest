server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: visualnest-backend
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:${MAIL_USERNAME:}}
    password: ${MAIL_APP_PASSWORD:${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:}}}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:true}
          connectiontimeout: 15000
          timeout: 15000
          writetimeout: 15000
          connectionpool: true
          connectionpoolsize: 5
          quitwait: false
          starttls:
            enable: ${SPRING_MAIL_STARTTLS_ENABLE:true}
          ssl:
            enable: ${SPRING_MAIL_SSL_ENABLE:false}
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

app:
  otp:
    store: ${APP_OTP_STORE:memory}
  baseUrl: ${APP_BASE_URL:}
  frontendBaseUrl: ${APP_FRONTEND_BASE_URL:http://localhost:5173}
  admin:
    email: ${APP_ADMIN_EMAIL:}
    password: ${APP_ADMIN_PASSWORD:}
  jwt:
    secret: ${JWT_SECRET}
    ttlMinutes: 120
  storage:
    provider: ${APP_STORAGE_PROVIDER:local}
    uploadDir: ${APP_STORAGE_UPLOAD_DIR:${user.home}/visualnest-uploads}
    supabase:
      url: ${APP_STORAGE_SUPABASE_URL:}
      serviceKey: ${APP_STORAGE_SUPABASE_SERVICE_KEY:}
      bucket: ${APP_STORAGE_SUPABASE_BUCKET:}
      folder: ${APP_STORAGE_SUPABASE_FOLDER:gallery}
  cors:
    allowedOrigins:
      - "http://localhost:5173"
      - "http://127.0.0.1:5173"
      - "https://visualnest.vercel.app"
      - "https://www.visualnest.vercel.app"
      - "https://*.vercel.app"

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
